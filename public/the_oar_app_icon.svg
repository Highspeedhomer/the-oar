<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="90" fill="#111214"/>

  <!-- "The" in blue italic serif -->
  <text
    x="256" y="175"
    text-anchor="middle"
    font-family="Liberation Serif, FreeSerif, Georgia, serif"
    font-size="72"
    font-style="italic"
    font-weight="bold"
    fill="#4A9FD4">The</text>

  <!-- "Oar" in large bold sans-serif white -->
  <text
    x="256" y="345"
    text-anchor="middle"
    font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
    font-size="210"
    font-weight="bold"
    fill="#FFFFFF">Oar</text>

  <!-- "Row • Fast • Fuel" in blue -->
  <text
    x="256" y="415"
    text-anchor="middle"
    font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
    font-size="30"
    font-weight="400"
    fill="#4A9FD4">Row • Fast • Fuel</text>
</svg>
